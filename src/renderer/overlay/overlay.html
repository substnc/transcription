<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<link rel="stylesheet" href="../icon.css">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-user-select: none; }
  .pill { display: flex; align-items: center; gap: 8px; margin: 4px auto; width: max-content; max-width: 210px; height: 36px; padding: 0 16px 0 10px; border-radius: 999px;
    background: #000000; color: #ffffff; font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill .check, .pill .bang { display: none; }
  .done #icon, .error #icon { display: none; }
  .done .check { display: block; margin-left: 2px; }
  .error { background: #ffffff; color: #000000; }
  .error .bang { display: flex; width: 16px; height: 16px; border-radius: 999px; background: #000000; color: #ffffff; font-size: 11px; font-weight: 700; align-items: center; justify-content: center; margin-left: 2px; }
  #text { overflow: hidden; text-overflow: ellipsis; }
</style></head>
<body><div id="pill" class="pill listening"><span id="icon"></span><svg class="check" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.4l3.2 3.2L13 4.8" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="bang">!</span><span id="text">Lyssnar…</span></div>
<script src="../icon.js"></script>
<script src="overlay.js"></script></body></html>

appId: se.substnc.diktera
productName: Diktera
copyright: sub.stnc
directories:
  output: dist
  buildResources: build
files:
  - src/**/*
  - assets/**/*
  - package.json
  - "!**/*.map"
asarUnpack:
  - node_modules/sherpa-onnx-node/**
  - node_modules/sherpa-onnx-darwin-*/**
  - node_modules/uiohook-napi/**
  - node_modules/ffmpeg-static/**
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: assets/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    LSUIElement: true
    NSMicrophoneUsageDescription: Diktera behöver mikrofonen för att transkribera ditt tal lokalt på datorn.
    NSAppleEventsUsageDescription: Diktera använder System Events för att klistra in dikterad text med ⌘V.
dmg:
  writeUpdateInfo: false
publish: null
# Native moduler (uiohook, sherpa) har färdiga N-API-binärer; bygg inte om dem.
npmRebuild: false


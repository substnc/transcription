appId: se.substnc.speak
productName: Speak
artifactName: Speak-${version}-${arch}.${ext}
copyright: sub.stnc
directories:
  output: dist
  buildResources: build
files:
  - src/**/*
  - assets/**/*
  - package.json
  - "!**/*.map"
extraResources:
  - from: resources/bin
    to: bin
  - from: resources/pianissimo
    to: pianissimo
asarUnpack:
  - node_modules/sherpa-onnx-node/**
  - node_modules/sherpa-onnx-darwin-*/**
  - node_modules/uiohook-napi/**
  - node_modules/ffmpeg-static/**
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  icon: assets/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    LSUIElement: true
    # Filen heter Speak.app och namnet som visas är "Speak.". CFBundleName får inte ändras:
    # Electron letar upp "<CFBundleName> Helper.app" vid start och kraschar annars ("Unable to find helper app").
    CFBundleDisplayName: Speak.
    NSMicrophoneUsageDescription: Speak behöver mikrofonen för att transkribera ditt tal lokalt på datorn.
    NSAudioCaptureUsageDescription: Speak tar upp datorns ljud under mötesinspelning så att alla deltagare i ett videomöte hörs. Ljudet stannar på datorn.
    NSScreenCaptureUsageDescription: Speak behöver skärminspelning bara för att ta upp datorns ljud. Ingen bild sparas.
    NSAppleEventsUsageDescription: Speak använder System Events för att klistra in dikterad text med ⌘V.
dmg:
  writeUpdateInfo: false
publish: null
# Native moduler (uiohook, sherpa) har färdiga N-API-binärer; bygg inte om dem.
npmRebuild: false


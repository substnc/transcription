name: Konvertera KB-Whisper

on:
  workflow_dispatch:
    inputs:
      size:
        description: "Modellstorlek (large är bäst på svenska)"
        type: choice
        default: large
        options: [large, medium, small, base, tiny]

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SIZE: ${{ inputs.size }}
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Frigör plats på byggservern
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL && df -h / | tail -1 && free -h && nproc
      - name: Installera beroenden
        run: pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple -r scripts/kb-whisper/requirements.txt
      - name: Verifiera konverteraren (numerisk kontroll)
        run: cd scripts/kb-whisper && python test_equivalence.py
      - name: Hämta modellen (bara safetensors)
        run: |
          python - <<'EOF'
          import os
          from huggingface_hub import snapshot_download
          p = snapshot_download(f"KBLab/kb-whisper-{os.environ['SIZE']}", local_dir="hf",
                                allow_patterns=["config.json", "generation_config.json", "*.safetensors", "*.safetensors.index.json", "README.md"])
          print(p)
          EOF
          ls -la hf
      - name: Kontrollera licens
        run: python scripts/kb-whisper/verify_license.py hf
      - name: Konvertera till OpenAI-format
        run: python scripts/kb-whisper/hf_to_openai.py --src hf --out kb.pt && rm -rf hf ~/.cache/huggingface && ls -la kb.pt && free -h
      - name: Konvertera till ggml för whisper.cpp (Metal), f16 och q5_0
        run: |
          git clone -q --depth 1 --branch v1.8.2 https://github.com/ggml-org/whisper.cpp.git /tmp/wcpp
          cmake -S /tmp/wcpp -B /tmp/wcpp/build -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build /tmp/wcpp/build --config Release -j 4 --target quantize whisper-cli >/dev/null
          WHISPER_PKG=$(python -c "import whisper,os; print(os.path.dirname(os.path.dirname(whisper.__file__)))")
          mkdir -p ggml/whisper-cpp-kb-$SIZE-metal ggml/whisper-cpp-kb-$SIZE-metal-q5
          python /tmp/wcpp/models/convert-pt-to-ggml.py kb.pt "$WHISPER_PKG" ggml/whisper-cpp-kb-$SIZE-metal
          /tmp/wcpp/build/bin/quantize ggml/whisper-cpp-kb-$SIZE-metal/ggml-model.bin ggml/whisper-cpp-kb-$SIZE-metal-q5/ggml-model-q5_0.bin q5_0
          ls -la ggml/*
      - name: Testkör ggml-modellen (svenskt tal från lokal TTS)
        run: |
          npm install --no-save sherpa-onnx-node@1.13.8 >/dev/null
          B=https://github.com/k2-fsa/sherpa-onnx/releases/download
          curl -sSL $B/tts-models/vits-piper-sv_SE-nst-medium.tar.bz2 | tar xj
          node - <<'EOF'
          const s = require('sherpa-onnx-node'); const { writeWav } = require('./src/engine/audio'); const w = require('./src/engine/whispercpp');
          const size = process.env.SIZE;
          const tts = new s.OfflineTts({ model: { vits: { model: 'vits-piper-sv_SE-nst-medium/sv_SE-nst-medium.onnx', tokens: 'vits-piper-sv_SE-nst-medium/tokens.txt', dataDir: 'vits-piper-sv_SE-nst-medium/espeak-ng-data' }, numThreads: 2, debug: 0, provider: 'cpu' }, maxNumSentences: 1 });
          const a = tts.generate({ text: 'Vi bestämde att leverera ljudet till kampanjen på fredag.', sid: 0, speed: 1.0 });
          const r = new s.LinearResampler(a.sampleRate, 16000); writeWav('tts.wav', r.resample(a.samples, true));
          (async () => {
            for (const m of [`ggml/whisper-cpp-kb-${size}-metal/ggml-model.bin`, `ggml/whisper-cpp-kb-${size}-metal-q5/ggml-model-q5_0.bin`]) {
              const segs = await w.transcribeWav('tts.wav', { binary: '/tmp/wcpp/build/bin/whisper-cli', model: m, language: 'sv' });
              const text = segs.map((x) => x.text).join(' '); console.log(m, '->', text);
              if (!/fredag/i.test(text)) { console.error('Ordet "fredag" saknas'); process.exit(1); }
            }
          })().catch((e) => { console.error(e); process.exit(1); });
          EOF
      - name: Paketera ggml
        run: |
          cd ggml && tar cjf ../kb-whisper-$SIZE-metal.tar.bz2 whisper-cpp-kb-$SIZE-metal && tar cjf ../kb-whisper-$SIZE-metal-q5.tar.bz2 whisper-cpp-kb-$SIZE-metal-q5 && cd .. && rm -rf ggml && ls -la *.tar.bz2
      - uses: actions/upload-artifact@v4
        with:
          name: kb-whisper-${{ inputs.size }}-metal
          path: kb-whisper-${{ inputs.size }}-metal.tar.bz2
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: kb-whisper-${{ inputs.size }}-metal-q5
          path: kb-whisper-${{ inputs.size }}-metal-q5.tar.bz2
          compression-level: 0
      - name: Exportera till ONNX
        run: |
          mkdir -p out/sherpa-onnx-whisper-kb-$SIZE && cd out/sherpa-onnx-whisper-kb-$SIZE
          # Två körningar så att bara halva modellen ligger i minnet åt gången (byggservern har 7,8 GB).
          # large får ingen int8-variant: komprimeringen håller modellen dubbelt i minnet och appen kör ändå full precision.
          EXTRA=""; [ "$SIZE" = "large" ] && EXTRA="--no-int8"
          python ../../scripts/kb-whisper/export_onnx_sherpa.py --model kb-$SIZE --checkpoint ../../kb.pt --part encoder $EXTRA
          free -h
          python ../../scripts/kb-whisper/export_onnx_sherpa.py --model kb-$SIZE --checkpoint ../../kb.pt --part decoder $EXTRA
          rm -f ../../kb.pt
          ls -la
      - name: Testkör i sherpa-onnx (svenskt tal från lokal TTS)
        run: |
          npm install --no-save sherpa-onnx-node@1.13.8
          B=https://github.com/k2-fsa/sherpa-onnx/releases/download
          curl -sSL $B/tts-models/vits-piper-sv_SE-nst-medium.tar.bz2 | tar xj
          node - <<'EOF'
          const s = require('sherpa-onnx-node');
          const size = process.env.SIZE;
          const dir = `out/sherpa-onnx-whisper-kb-${size}`;
          const tts = new s.OfflineTts({ model: { vits: { model: 'vits-piper-sv_SE-nst-medium/sv_SE-nst-medium.onnx', tokens: 'vits-piper-sv_SE-nst-medium/tokens.txt', dataDir: 'vits-piper-sv_SE-nst-medium/espeak-ng-data' }, numThreads: 2, debug: 0, provider: 'cpu' }, maxNumSentences: 1 });
          const a = tts.generate({ text: 'Vi bestämde att leverera ljudet till kampanjen på fredag.', sid: 0, speed: 1.0 });
          const rec = new s.OfflineRecognizer({ featConfig: { sampleRate: 16000, featureDim: 80 }, modelConfig: { whisper: { encoder: `${dir}/kb-${size}-encoder.onnx`, decoder: `${dir}/kb-${size}-decoder.onnx`, language: 'sv', task: 'transcribe', tailPaddings: -1 }, tokens: `${dir}/kb-${size}-tokens.txt`, numThreads: 4, provider: 'cpu', debug: 0 } });
          const st = rec.createStream(); st.acceptWaveform({ samples: a.samples, sampleRate: a.sampleRate }); rec.decode(st);
          const text = rec.getResult(st).text; console.log('Transkript:', text);
          if (!/fredag/i.test(text)) { console.error('Ordet "fredag" saknas, modellen fungerar inte'); process.exit(1); }
          EOF
      - name: Paketera
        run: |
          cd out && tar cjf ../kb-whisper-$SIZE.tar.bz2 sherpa-onnx-whisper-kb-$SIZE && cd .. && ls -la kb-whisper-$SIZE.tar.bz2
      - uses: actions/upload-artifact@v4
        with:
          name: kb-whisper-${{ inputs.size }}
          path: kb-whisper-${{ inputs.size }}.tar.bz2
          compression-level: 0

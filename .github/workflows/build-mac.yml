name: Bygg Mac-app

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest   # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Bygg dmg
        run: npx electron-builder --mac dmg zip --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Diktera-arm64
          path: |
            dist/*.dmg
            dist/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publicera som release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" out/*/*.dmg out/*/*.zip \
            --repo "${{ github.repository }}" --prerelease \
            --title "Diktera bygge ${{ github.run_number }}" \
            --notes "Osignerad testversion. Byggd för Apple Silicon (M1 och senare). Efter installation: kör \`xattr -cr /Applications/Diktera.app\` i Terminal en gång, annars säger macOS att appen är skadad."

name: Bygg Mac-app

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # för att kunna ta bort gamla byggen

jobs:
  build:
    runs-on: macos-latest   # Apple Silicon
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Bygg whisper.cpp med Metal (grafikkretsen)
        run: |
          git clone -q --depth 1 --branch v1.8.2 https://github.com/ggml-org/whisper.cpp.git /tmp/wcpp
          cmake -S /tmp/wcpp -B /tmp/wcpp/build -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/wcpp/build --config Release -j 4 --target whisper-cli whisper-server
          mkdir -p resources/bin && cp /tmp/wcpp/build/bin/whisper-cli /tmp/wcpp/build/bin/whisper-server resources/bin/ && ls -la resources/bin
          ./resources/bin/whisper-cli --help | head -3
      - name: Testa Metal-motorn på riktigt (tiny-modell + svenskt TTS-tal)
        run: |
          npm install --no-save sherpa-onnx-node@1.13.8 >/dev/null
          B=https://github.com/k2-fsa/sherpa-onnx/releases/download
          curl -sSL $B/tts-models/vits-piper-sv_SE-nst-medium.tar.bz2 | tar xj
          curl -sSL -o ggml-tiny.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin
          node - <<'EOF'
          const s = require('sherpa-onnx-node'); const { writeWav } = require('./src/engine/audio'); const w = require('./src/engine/whispercpp');
          const tts = new s.OfflineTts({ model: { vits: { model: 'vits-piper-sv_SE-nst-medium/sv_SE-nst-medium.onnx', tokens: 'vits-piper-sv_SE-nst-medium/tokens.txt', dataDir: 'vits-piper-sv_SE-nst-medium/espeak-ng-data' }, numThreads: 2, debug: 0, provider: 'cpu' }, maxNumSentences: 1 });
          const a = tts.generate({ text: 'Vi ses på fredag klockan tio.', sid: 0, speed: 1.0 });
          const r = new s.LinearResampler(a.sampleRate, 16000); const x = r.resample(a.samples, true);
          writeWav('tts.wav', x);
          const t0 = Date.now();
          w.transcribeWav('tts.wav', { binary: 'resources/bin/whisper-cli', model: 'ggml-tiny.bin', language: 'sv' }).then((segs) => {
            console.log('Metal-motorn:', JSON.stringify(segs), 'ms', Date.now() - t0);
            if (!segs.length) { console.error('inget resultat'); process.exit(1); }
          }).then(async () => {
            // Dikteringens whisper-server: modellen laddad en gång, två dikteringar i rad.
            const srv = new w.WhisperServer({ binary: 'resources/bin/whisper-server', model: 'ggml-tiny.bin', threads: 4 });
            for (let k = 0; k < 2; k++) {
              const t = Date.now();
              const segs = await srv.transcribe(x, { language: 'sv', prompt: 'Speak.' });
              console.log(`whisper-server diktering ${k + 1}:`, JSON.stringify(segs), 'ms', Date.now() - t);
              if (!segs.length) throw new Error('whisper-server gav inget resultat');
            }
            srv.stop();
          }).catch((e) => { console.error(e); process.exit(1); });
          EOF
      - name: Bygg dmg
        run: npx electron-builder --mac dmg zip --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # Bara zip-filen (den som installeras), i 7 dagar, och bara från Anthons gren. Byggen är ~300 MB styck
      # och GitHubs lagring för byggen tog slut när alla sparades i 90 dagar.
      # Lagringen på GitHub tar slut annars. Behåll det senaste bygget
      # (listan är nyast först) ifall det nya inte fungerar.
      - name: Ta bort gamla byggen
        if: github.ref_name == 'claude/ai-dictation-app-mac-31cco2' || github.ref_name == 'main' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/artifacts" --paginate -q '.artifacts[].id' | tail -n +2 |
            while read -r id; do gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true; done

      - uses: actions/upload-artifact@v5
        if: github.ref_name == 'claude/ai-dictation-app-mac-31cco2' || github.ref_name == 'main' || github.event_name == 'workflow_dispatch'
        with:
          name: Speak-arm64
          path: dist/*.zip
          retention-days: 7

name: Bygg Mac-app

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest   # Apple Silicon
            arch: arm64
          - os: macos-13       # Intel
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Bygg dmg
        run: npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Diktera-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publicera som release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" out/*/*.dmg out/*/*.zip \
            --repo "${{ github.repository }}" --prerelease \
            --title "Diktera bygge ${{ github.run_number }}" \
            --notes "Osignerad testversion. Ladda ner dmg för din Mac (arm64 = Apple Silicon, x64 = Intel). Efter installation: kör \`xattr -cr /Applications/Diktera.app\` i Terminal en gång, annars säger macOS att appen är skadad."

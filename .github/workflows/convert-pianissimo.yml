name: Konvertera Pianissimo

# Gör om Klang Pianissimo (öppen svensk taligenkänning, CC BY 4.0) till sherpa-onnx-format
# så att Speak kan köra den lokalt. Resultatet importeras i Inställningar → Importera modell.
on:
  workflow_dispatch:
    inputs:
      attention:
        description: "Attention vid export (full om modellens egen inte går att exportera)"
        type: choice
        default: modellens
        options: [modellens, full]

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Frigör plats på byggservern
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL && df -h / | tail -1 && free -h && nproc
      - name: Installera beroenden
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          pip install "nemo_toolkit[asr]" onnx onnxruntime onnxscript huggingface_hub
          pip list 2>/dev/null | grep -iE "^(torch|nemo|onnx|numpy)" || true
      - name: Kontrollera licens
        run: python scripts/pianissimo/check_license.py
      - name: Exportera till ONNX (sherpa-format)
        run: |
          mkdir -p out && cd out
          python ../scripts/pianissimo/export_onnx.py ${{ inputs.attention == 'full' && '--full-attention' || '' }}
          rm -rf ~/.cache/huggingface ~/.cache/torch
          df -h / | tail -1
      - name: Paketera
        run: |
          I=pkg/sherpa-onnx-nemo-pianissimo-sv; F=pkg/sherpa-onnx-nemo-pianissimo-sv-fp32
          mkdir -p $I $F
          cp out/encoder.int8.onnx out/decoder.int8.onnx out/joiner.int8.onnx out/tokens.txt out/bpe.vocab $I/
          cp out/encoder.onnx out/encoder.weights out/decoder.onnx out/joiner.onnx out/tokens.txt out/bpe.vocab $F/
          for d in $I $F; do
            printf 'Klang Pianissimo (KlangAI/pianissimo-sv), CC BY 4.0, https://huggingface.co/KlangAI/pianissimo-sv\nKonverterad till sherpa-onnx-format av Speak (scripts/pianissimo).\n' > $d/LICENSE.txt
          done
          rm -rf out
          du -sh pkg/*
      - name: Testkör genom appens motor (svenskt tal från lokal TTS)
        run: |
          npm install --no-save sherpa-onnx-node@1.13.8 >/dev/null
          B=https://github.com/k2-fsa/sherpa-onnx/releases/download
          curl -sSL $B/tts-models/vits-piper-sv_SE-nst-medium.tar.bz2 | tar xj
          curl -sSL -o silero_vad.onnx $B/asr-models/silero_vad.onnx
          for v in pianissimo-sv pianissimo-sv-fp32; do
            rm -rf m && mkdir m && cp silero_vad.onnx m/ && ln -s "$PWD/pkg/sherpa-onnx-nemo-$v" m/
            node scripts/pianissimo/test_model.js m vits-piper-sv_SE-nst-medium
          done
      - name: Packa
        run: |
          cd pkg
          tar cjf ../pianissimo-sv.tar.bz2 sherpa-onnx-nemo-pianissimo-sv
          tar cjf ../pianissimo-sv-fp32.tar.bz2 sherpa-onnx-nemo-pianissimo-sv-fp32
          cd .. && ls -la *.tar.bz2
      - uses: actions/upload-artifact@v5
        with:
          name: pianissimo-sv
          path: pianissimo-sv.tar.bz2
          compression-level: 0
      - uses: actions/upload-artifact@v5
        with:
          name: pianissimo-sv-fp32
          path: pianissimo-sv-fp32.tar.bz2
          compression-level: 0
